version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-do-not-use-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-30}
      - DEBUG=${DEBUG:-false}
    volumes:
      # Mount the app directory so code changes reflect without rebuilding
      - ./app:/app/app
    restart: unless-stopped
